name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'service.scrob/**'
      - 'repository.scrob/**'
      - 'generate.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          print(ET.parse('service.scrob/addon.xml').getroot().get('version'))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "service.scrob version: $VERSION"

      - name: Build ZIPs
        run: |
          mkdir -p _site/service.scrob _site/repository.scrob
          python3 - <<'EOF'
import os, zipfile, xml.etree.ElementTree as ET

def make_zip(addon_dir, out_path, skip_exts={'.pyc'}):
    with zipfile.ZipFile(out_path, 'w', zipfile.ZIP_DEFLATED) as z:
        # directory entry must come first — Kodi rejects zips without it
        z.mkdir(addon_dir)
        for root, dirs, files in os.walk(addon_dir):
            dirs[:] = [d for d in sorted(dirs) if d != '__pycache__']
            for name in sorted(files):
                if os.path.splitext(name)[1] in skip_exts:
                    continue
                path = os.path.join(root, name)
                z.write(path)

svc_ver  = ET.parse('service.scrob/addon.xml').getroot().get('version')
repo_ver = ET.parse('repository.scrob/addon.xml').getroot().get('version')

make_zip('service.scrob',    f'_site/service.scrob/service.scrob-{svc_ver}.zip')
make_zip('repository.scrob', f'_site/repository.scrob/repository.scrob-{repo_ver}.zip')
print(f'service.scrob-{svc_ver}.zip')
print(f'repository.scrob-{repo_ver}.zip')
EOF

      - name: Generate addons.xml
        run: |
          python3 generate.py
          cp addons.xml addons.xml.md5 _site/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          print(ET.parse('repository.scrob/addon.xml').getroot().get('version'))
          ")
          REPO_ZIP="_site/repository.scrob/repository.scrob-${REPO_VERSION}.zip"
          SVC_ZIP="_site/service.scrob/service.scrob-${{ steps.version.outputs.version }}.zip"
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "$REPO_ZIP" "$SVC_ZIP" --clobber
          else
            gh release create "$TAG" "$REPO_ZIP" "$SVC_ZIP" --title "$TAG" --latest
          fi
